<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Cristian Vortolomei, Software Engineer in Vienna">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.link{stroke:#818CF8;stroke-width:1.6;stroke-dasharray:120;stroke-dashoffset:120;animation:draw 6s ease-in-out infinite}
.nn{fill:#818CF8;animation:hit 6s ease-in-out infinite}
.pulse{fill:none;stroke:#FBBF24;stroke-width:1.5;transform-origin:835px 128px;animation:pulse 3s ease-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes draw{0%,10%{stroke-dashoffset:120;opacity:0}25%,75%{stroke-dashoffset:0;opacity:.9}90%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes hit{0%,15%{fill:#334155}30%,75%{fill:#818CF8}90%,100%{fill:#334155}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.link,.nn,.pulse,.cursor{animation:none}.link{stroke-dashoffset:0;opacity:.9}.nn{fill:#818CF8}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#151E3F"/></linearGradient>
<radialGradient id="glow" cx="0.835" cy="0.49230769230769234" r="0.32"><stop offset="0" stop-color="#6366F1" stop-opacity=".28"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".05"/></pattern>
<clipPath id="r"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1000" height="260" fill="url(#bg)"/>
<rect width="1000" height="260" fill="url(#grid)"/>
<rect width="1000" height="260" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="999" height="259" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
